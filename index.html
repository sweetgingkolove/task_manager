<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Minimalist To-Do</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
</head>
<body>

  <div class="kanso-wrapper">
    <!-- Header -->
    <header class="kanso-header">
      <div class="header-branding">
        <div class="title-with-action">
          <h1 class="app-title">Tasks</h1>
          <button type="button" class="add-task-btn" id="toggle-add-btn" title="Add intention (+ or /)" aria-label="Add task">
            <span class="add-btn-icon">＋</span>
          </button>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </header>

    <!-- Collapsible Task Creation Form (Opened via ＋ button or / shortcut) -->
    <form id="add-form" class="kanso-add-form collapsible-form" autocomplete="off" style="display: none;">
      <div class="input-line-container">
        <span class="input-prefix">＋</span>
        <input
          type="text"
          id="task-input"
          class="kanso-input"
          placeholder="Write intention or task..."
          aria-label="New task input"
        />
        <button type="submit" class="submit-btn" aria-label="Add task">Add</button>
        <button type="button" class="close-add-btn" id="close-add-btn" title="Close (Escape)">✕</button>
      </div>
    </form>

    <!-- Category Notebook Tabs Bar (Now, Later, All) -->
    <nav class="kanso-category-bar" aria-label="Category pages">
      <div class="category-tabs-wrapper" id="category-tabs">
        <!-- Rendered by app.js: Now, Later, All -->
      </div>
    </nav>

    <!-- Tag Collection Filter Bar (replaces All / Pending / Done) -->
    <nav class="kanso-tag-bar" id="tag-bar" aria-label="Filter by tag">
      <div class="tag-bar-scroll" id="tag-bar-scroll">
        <!-- Rendered dynamically by app.js: All, #tag1, #tag2, etc. -->
      </div>
      <button type="button" class="clear-done-btn" id="clear-done-btn" title="Clear fulfilled intentions">
        Clear done
      </button>
    </nav>

    <!-- Swipeable Pages Carousel Canvas -->
    <main class="kanso-canvas">
      <div class="pages-carousel" id="pages-carousel">
        <!-- Injected dynamically by app.js: Each category is a full-width swipeable slide -->
      </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="kanso-footer">
      <div class="shortcuts-hint">
        <span><kbd>Swipe</kbd> or <kbd>Alt</kbd>+<kbd>→</kbd> pages</span>
        <span>•</span>
        <span><kbd>＋</kbd> or <kbd>/</kbd> to add</span>
        <span>•</span>
        <span>Click <kbd>#tag</kbd> to filter</span>
      </div>
      <div class="footer-signoff">
        <span>木漏れ日</span>
      </div>
    </footer>

    <!-- Floating Category Picker Popover -->
    <div class="category-picker-popover" id="category-picker" style="display: none;">
      <div class="picker-title">Move to Chapter</div>
      <div class="picker-list" id="picker-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
